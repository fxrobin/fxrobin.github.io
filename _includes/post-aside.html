<aside class="toc-sidebar">
  <div class="sidebar-section-title">CONTENTS</div>
  {% include toc.html html=content class="toc-list" h_min=2 h_max=3 %}
  <hr class="sidebar-divider">
  <div class="sidebar-section-title">SHARE</div>
  <div class="sidebar-share">
    <a href="https://github.com/fxrobin" target="_blank" rel="nofollow" title="GitHub">[gh]</a>
    <a href="https://www.linkedin.com/shareArticle?mini=true&amp;url={{ site.url | append: page.url | url_encode }}&amp;title={{ page.title | url_encode }}" target="_blank" rel="nofollow" title="Share on LinkedIn">[li]</a>
    <a href="https://x.com/intent/tweet?text={{ page.title | url_encode }}&amp;url={{ site.url | append: page.url | url_encode }}" target="_blank" rel="nofollow" title="Share on X">[x]</a>
  </div>
  {% if page.tags and page.tags.size > 0 %}
  <div class="pro-aside-block">
    <hr class="sidebar-divider">
    <div class="sidebar-section-title">Tags</div>
    <div class="pro-aside-tags">
      {% for tag in page.tags %}
        <a href="{{ site.baseurl }}/tags/{% if page.lang %}{{ page.lang }}/{% endif %}#{{ tag | slugify }}" class="tag">{{ tag }}</a>
      {% endfor %}
    </div>
  </div>
  {% endif %}
</aside>
