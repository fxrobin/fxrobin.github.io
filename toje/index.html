<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOJE — Thomson TO8</title>
  <meta name="description" content="Émulateur Thomson TO8 TOJE compilé en WebAssembly.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="toje-web.css">
</head>
<body>
  <main class="chassis">
    <header class="brand">
      <span class="logo">THOMSON <b>TO8</b></span>
      <span class="sub">TOJE · WebAssembly</span>
      <span id="status" class="status">chargement…</span>
    </header>

    <section id="screen-frame" class="screen-frame">
      <canvas id="screen" width="704" height="464" tabindex="0"
              aria-label="Écran du TO8 — cliquer puis taper au clavier"></canvas>
      <div id="drop-hint" class="drop-hint" hidden>Déposer la disquette (.fd)</div>
      <button id="start" class="overlay-start" hidden>Cliquer pour activer le son</button>
    </section>

    <section class="panel">
      <div class="row">
        <label class="keycap action">
          <input id="disk-input" type="file" accept=".fd,.sap" hidden>
          Insérer une disquette…
        </label>
        <button id="reset" class="keycap amber">Reset</button>
        <button id="sound" class="keycap toggle" aria-pressed="true"><i class="led"></i>Son</button>
        <button id="fullscreen" class="keycap">Plein écran</button>
      </div>
      <div class="row">
        <span class="disk-line">Disquette : <b id="disk-name">aucune</b></span>
        <span class="spacer"></span>
        <button id="joy-mode" class="keycap toggle" aria-pressed="true"
                title="Flèches + Espace/Alt pilotent la manette au lieu des touches du TO8">
          <i class="led"></i>Manette clavier
        </button>
        <span class="seg" role="group" aria-label="Port de la manette">
          <button class="keycap seg-btn" data-port="0" aria-pressed="true">Port 1</button>
          <button class="keycap seg-btn" data-port="1" aria-pressed="false">Port 2</button>
        </span>
      </div>
      <p class="help">
        Glisser une image <code>.fd</code> sur l'écran ou « Insérer une disquette » :
        le TO8 redémarre et presse <b>B</b> au menu. Clavier AZERTY positionnel.
        Manette : flèches, <b>Espace</b> = bouton A, <b>Alt</b> = bouton B, ou une
        manette USB.
      </p>
    </section>
  </main>

  <script src="classes.wasm-runtime.js"></script>
  <script src="toje-web.js"></script>
</body>
</html>
