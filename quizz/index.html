<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121A38">
  <title>Quiz INSA 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <div class="top"><span id="me">Quiz INSA 2026</span><span id="status"></span></div>

    <section id="join" class="center" hidden>
      <div class="mono">INSA Lyon · 2026</div>
      <h1 class="title" style="font-size:1.8rem">À quoi servez-vous encore ?</h1>
      <form id="join-form" style="width:100%;display:flex;flex-direction:column;gap:.8rem;margin-top:1.5rem;text-align:left">
        <label for="name" class="muted">Ton prénom</label>
        <input id="name" class="field" autocomplete="given-name" autocapitalize="words" maxlength="20" required>
        <div id="join-error" class="error" role="alert"></div>
        <button class="go" type="submit" id="join-btn">Rejoindre</button>
      </form>
    </section>

    <section id="wait" class="center" hidden>
      <div class="mono" id="wait-kicker">En attente</div>
      <h1 class="title" style="font-size:1.6rem" id="wait-title">Regarde l'écran</h1>
      <p class="muted" id="wait-text"></p>
    </section>

    <section id="question" hidden style="flex:1;display:flex">
      <div id="answers" class="answers" style="width:100%"></div>
    </section>

    <section id="sent" class="center" hidden>
      <div class="mono">Réponse envoyée</div>
      <div class="big" id="sent-shape"></div>
      <h1 class="title" style="font-size:1.4rem">Attends la correction</h1>
    </section>

    <section id="end" class="center" hidden>
      <div class="mono" id="end-kicker">Fin de la manche</div>
      <h1 class="title big" id="end-round"></h1>
      <p style="font-size:1.3rem" id="end-total"></p>
      <p class="muted" id="end-rank"></p>
    </section>
  </main>

  <div id="verdict" class="verdict" hidden>
    <div class="mark" id="verdict-mark"></div>
    <h1 class="title" style="font-size:2rem" id="verdict-title"></h1>
    <p id="verdict-score"></p>
  </div>

  <script type="module" src="js/eleve.js"></script>
</body>
</html>
